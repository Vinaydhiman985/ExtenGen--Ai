services:
  - type: web
    name: extengen-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEFAULT_ORG_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: DEFAULT_USER_ID
        value: 00000000-0000-0000-0000-000000000002
